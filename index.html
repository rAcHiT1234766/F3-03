<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="FieldLog: a field-service job tracker that keeps working offline and syncs when connected."
    />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>FieldLog</title>
    <script>
      // Apply a theme chosen in Settings before first paint (see src/theme.ts).
      try {
        var theme = localStorage.getItem('fieldlog:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <style>
      /* Static first paint while the app's JavaScript loads: the same ink app bar as the app.
         The stylesheet is already applied, so the tokens are available; fallbacks cover dev.
         System fonts only: the web fonts then start loading with the app, after the JavaScript,
         instead of competing with it before first paint. */
      .boot-bar {
        background: var(--header, #16171a);
        color: var(--header-text, #f2f1ec);
        border-bottom: 1px solid var(--header-border, #2c2e33);
        font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      }
      .boot-bar > div,
      .boot-msg {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      .boot-bar > div {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 56px;
        font-size: 1.3125rem;
        font-weight: 700;
        font-stretch: 82%;
        letter-spacing: -0.01em;
      }
      .boot-msg {
        padding-top: 2.25rem;
        color: var(--text-2, #4b4e55);
        font-family: ui-monospace, Consolas, Menlo, monospace;
        font-size: 0.875rem;
      }
      @media (max-width: 640px) {
        .boot-bar > div,
        .boot-msg {
          padding-left: 1rem;
          padding-right: 1rem;
        }
        .boot-bar > div {
          min-height: 55px;
          padding-top: 0.5rem;
          padding-bottom: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-bar">
        <div>
          <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="12" fill="#ff6b1a" />
            <rect x="12" y="38" width="7" height="10" rx="1.5" fill="#16171a" />
            <rect x="23" y="30" width="7" height="18" rx="1.5" fill="#16171a" />
            <rect x="34" y="22" width="7" height="26" rx="1.5" fill="#16171a" />
            <rect
              x="46.25"
              y="15.25"
              width="4.5"
              height="31.5"
              rx="1"
              fill="none"
              stroke="#16171a"
              stroke-width="2.5"
            />
          </svg>
          FieldLog
        </div>
      </div>
      <p class="boot-msg">Opening FieldLog…</p>
    </div>
    <noscript>FieldLog needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
